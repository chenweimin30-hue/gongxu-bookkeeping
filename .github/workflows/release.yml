name: Build APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        run: |
          for i in 1 2 3; do
            curl -sL --max-time 90 "https://aka.doubaocdn.com/s/tyy92KT59P" -o gongxu.apk
            if sha256sum -c - <<< "c34b570aa8fd0b1ad5a80c9132c423626c7cc39e1946eed28846c00dd156555c  gongxu.apk"; then
              break
            fi
            echo "download check failed, retry $i"
            sleep 5
          done
          ls -l gongxu.apk
          file gongxu.apk

      - name: Verify SHA256
        run: |
          echo "c34b570aa8fd0b1ad5a80c9132c423626c7cc39e1946eed28846c00dd156555c  gongxu.apk" | sha256sum -c -

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.8 --yes || true
          gh release create v1.8 gongxu.apk --title "工序记账本 v1.8" --notes "工序记账本 Android APK v1.8：每日工序+数量+单价记账，单价可后补，同工序自动回填，自定义周期截止结算，汇总工资总账，坚果云+下载文件夹自动备份。"