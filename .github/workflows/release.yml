name: Build APK Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: |
          curl -sL -o gongxu.apk "https://aka.doubaocdn.com/s/iiivNjs5EO"
          ls -la gongxu.apk
          python3 -c "
import zipfile
z = zipfile.ZipFile('gongxu.apk')
assert z.testzip() is None, 'zip corrupt'
print('APK zip OK, entries:', len(z.namelist()))
"
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.8 --yes --repo \"$GITHUB_REPOSITORY\" || true
          gh release create v1.8 gongxu.apk --repo \"$GITHUB_REPOSITORY\" --title \"工序记账本 v1.8\" --notes \"含自动备份（坚果云 + 手机下载文件夹）。安装后右下角⋯ → 自动备份 设置。\" --latest
